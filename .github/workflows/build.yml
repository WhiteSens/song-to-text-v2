name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.2.0" }
      - name: Find project folder
        id: p
        run: echo "dir=$(dirname "$(find . -name build.gradle -not -path './.git/*' | head -1)")" >> "$GITHUB_OUTPUT"
      - run: gradle build
        working-directory: ${{ steps.p.outputs.dir }}
      - uses: actions/upload-artifact@v4
        with:
          name: song-to-text
          path: ${{ steps.p.outputs.dir }}/build/libs/*.jar
